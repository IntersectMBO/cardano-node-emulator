name: cardano-node-emulator
version: 1.4.1.0
verbatim:
  cabal-version: 3.8

language: Haskell2010
default-extensions:
  - DeriveFoldable
  - DeriveFunctor
  - DeriveGeneric
  - DeriveLift
  - DeriveTraversable
  - ExplicitForAll
  - FlexibleContexts
  - GeneralizedNewtypeDeriving
  - ImportQualifiedPost
  - LambdaCase
  - NamedFieldPuns
  - ScopedTypeVariables
  - StandaloneDeriving
ghc-options:
  -Wall
  -Widentities
  -Wincomplete-record-updates
  -Wunused-packages
  -Wincomplete-uni-patterns
  -Wnoncanonical-monad-instances
  -Wredundant-constraints
  -Wmissing-import-lists
  -fobject-code
  -fno-ignore-interface-pragmas
  -fno-omit-interface-pragmas
  -fplugin-opt PlutusTx.Plugin:target-version=1.1.0
  -fplugin-opt PlutusTx.Plugin:defer-errors
  -fplugin=Polysemy.Plugin
  
library:
  source-dirs: src
  dependencies:
    - freer-extras
    - plutus-ledger
    - cardano-api
    - cardano-api:gen
    - cardano-crypto
    - cardano-ledger-alonzo
    - cardano-ledger-api
    - cardano-ledger-binary
    - cardano-ledger-conway
    - cardano-ledger-core
    - cardano-ledger-shelley
    - cardano-slotting
    - ouroboros-consensus
    - plutus-ledger-api
    - plutus-tx
    - polysemy
    - polysemy-plugin
    - sop-extras
    - strict-sop-core
    - aeson >=2
    - base >=4.9 && <5
    - bytestring
    - containers
    - data-default
    - freer-simple
    - hedgehog
    - lens
    - mtl
    - prettyprinter >=1.1.0.1
    - sop-core
    - text
    - time
  when:
    - condition: "impl(ghc <9.6) || impl(ghc >=9.7)"
      buildable: false
