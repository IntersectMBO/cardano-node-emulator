name: plutus-script-utils
version: 2.0.1.0

license: Apache-2.0
license-file:
  - LICENSE
  - NOTICE

verbatim:
  cabal-version: 3.8

language: Haskell2010

default-extensions:
  - ConstraintKinds
  - DataKinds
  - FlexibleContexts
  - FlexibleInstances
  - GADTs
  - ImportQualifiedPost
  - LambdaCase
  - MultiParamTypeClasses
  - MultiWayIf
  - NamedFieldPuns
  - NumericUnderscores
  - OverloadedStrings
  - PolyKinds
  - RankNTypes
  - RecordWildCards
  - ScopedTypeVariables
  - TemplateHaskell
  - TupleSections
  - TypeApplications
  - TypeFamilies
  - TypeOperators
  - ViewPatterns
  
ghc-options:
  -Wall
  -Wcompat
  -Wincomplete-record-updates
  -Wincomplete-uni-patterns
  -Wnoncanonical-monad-instances
  -Wno-unused-packages
  -Wincomplete-uni-patterns
  -Wincomplete-record-updates
  -Wredundant-constraints
  -Widentities
  -Wmissing-import-lists
  -Wno-missed-extra-shared-lib
  -fobject-code
  -fno-ignore-interface-pragmas
  -fignore-hpc-changes
  -fno-omit-interface-pragmas
  -fplugin-opt PlutusTx.Plugin:target-version=1.1.0
  -fplugin-opt PlutusTx.Plugin:defer-errors
  -fplugin-opt PlutusTx.Plugin:conservative-optimisation

library:
  source-dirs: src
  dependencies:
    - plutus-core
    - plutus-ledger-api
    - plutus-tx
    - plutus-tx-plugin
    - aeson
    - base >=4.9 && <5
    - base16-bytestring
    - bytestring
    - cborg
    - data-default
    - flat
    - hashable
    - mtl
    - prettyprinter
    - serialise
    - tagged
    - text
  ghc-options:
    -fprint-potential-instances
  when:
    - condition: "impl(ghc <9.6) || impl(ghc >=9.7)"
      buildable: false

tests:
  plutus-script-utils-test:
    main: Spec.hs
    source-dirs: test
    dependencies:
      - aeson
      - base
      - bytestring
      - plutus-core >=1.45 && <1.46
      - plutus-ledger-api >=1.45 && <1.46
      - plutus-script-utils
      - plutus-tx
      - plutus-tx-plugin
      - tasty
      - tasty-hunit
    when:
      - condition: "impl(ghc <9.6) || impl(ghc >=9.7)"
        buildable: false
