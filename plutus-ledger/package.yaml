spec-version: 0.36.0
name: plutus-ledger
version: 1.4.1.0
license: Apache-2.0
license-file:
  - LICENSE
  - NOTICE
language: Haskell2010
default-extensions:
  - DeriveFoldable
  - DeriveFunctor
  - DeriveGeneric
  - DeriveLift
  - DeriveTraversable
  - ExplicitForAll
  - FlexibleContexts
  - GeneralizedNewtypeDeriving
  - ImportQualifiedPost
  - MultiParamTypeClasses
  - ScopedTypeVariables
  - StandaloneDeriving
ghc-options:
  - -Wall
  - -Wnoncanonical-monad-instances
  - -Wno-unused-packages
  - -Wincomplete-uni-patterns
  - -Wincomplete-record-updates
  - -Wredundant-constraints
  - -Widentities
  - -fobject-code
  - -fno-ignore-interface-pragmas
  - -fno-omit-interface-pragmas
  - -fplugin-opt
  - PlutusTx.Plugin:target-version=1.1.0
  - -fplugin-opt
  - PlutusTx.Plugin:defer-errors

library:
  source-dirs: src
  exposed-modules:
    - Data.Aeson.Extras
    - Data.Time.Units.Extra
    - Ledger
    - Ledger.Address
    - Ledger.Address.Orphans
    - Ledger.AddressMap
    - Ledger.Blockchain
    - Ledger.Builtins.Orphans
    - Ledger.CardanoWallet
    - Ledger.Credential.Orphans
    - Ledger.Crypto
    - Ledger.Crypto.Orphans
    - Ledger.DCert.Orphans
    - Ledger.Index
    - Ledger.Index.Internal
    - Ledger.Orphans
    - Ledger.Scripts
    - Ledger.Scripts.Orphans
    - Ledger.Slot
    - Ledger.Test
    - Ledger.Tx
    - Ledger.Tx.CardanoAPI
    - Ledger.Tx.CardanoAPI.Internal
    - Ledger.Tx.Internal
    - Ledger.Tx.Orphans
    - Ledger.Tx.Orphans.V1
    - Ledger.Tx.Orphans.V2
    - Ledger.Typed.Scripts.Orphans
    - Ledger.Value.CardanoAPI
    - Ledger.Value.Orphans
  other-modules:
    - Codec.CBOR.Extras
  dependencies:
    - aeson
    - base >=4.9 && <5
    - base16-bytestring
    - bytestring
    - cborg
    - cardano-api
    - cardano-binary
    - cardano-crypto
    - cardano-ledger-alonzo
    - cardano-ledger-byron
    - cardano-ledger-conway
    - cardano-ledger-core
    - cardano-ledger-shelley
    - containers
    - cryptonite >=0.25
    - flat
    - hashable
    - http-api-data
    - lens
    - memory
    - ordered-containers
    - plutus-core
    - plutus-ledger-api
    - plutus-script-utils ^>=2.0.1
    - plutus-tx
    - plutus-tx-plugin
    - prettyprinter
    - scientific
    - serialise
    - servant
    - text
    - time-units
    - vector
  when:
    - condition: "!((impl(ghc >= 9.6) && impl(ghc < 9.7)) || (impl(ghc >= 9.12) && impl(ghc < 9.13)))"
      buildable: false

tests:
  plutus-ledger-test:
    main: Spec.hs
    source-dirs: test
    other-modules:
      - Ledger.Tx.CardanoAPISpec
    when:
      - condition: "!((impl(ghc >= 9.6) && impl(ghc < 9.7)) || (impl(ghc >= 9.12) && impl(ghc < 9.13)))"
        buildable: false
    dependencies:
      - aeson
      - base >=4.9 && <5
      - bytestring
      - cardano-api
      - cardano-api:gen
      - hedgehog
      - plutus-ledger
      - plutus-ledger-api
      - plutus-script-utils
      - plutus-tx
      - tasty
      - tasty-hedgehog
      - tasty-hunit
