spec-version: 0.36.0
name: freer-extras
version: 1.4.0.0
synopsis: Useful extensions to simple-freer
description: freer-extras provides logging and monitoring functions extending simple-freer
bug-reports: https://github.com/input-output-hk/plutus-apps/issues
license: Apache-2.0
license-file: LICENSE
author: Tobias Pflug
maintainer: tobias.pflug@iohk.io
build-type: Simple
language: Haskell2010
default-extensions:
  - DeriveFoldable
  - DeriveFunctor
  - DeriveGeneric
  - DeriveLift
  - DeriveTraversable
  - ExplicitForAll
  - GeneralizedNewtypeDeriving
  - ImportQualifiedPost
  - ScopedTypeVariables
  - StandaloneDeriving
ghc-options:
  - -Wall
  - -Wnoncanonical-monad-instances
  - -Wunused-packages
  - -Wincomplete-uni-patterns
  - -Wincomplete-record-updates
  - -Wredundant-constraints
  - -Widentities
  - -fplugin=Polysemy.Plugin

library:
  source-dirs: src
  exposed-modules:
    - Control.Monad.Freer.Extras
    - Control.Monad.Freer.Extras.Delay
    - Control.Monad.Freer.Extras.Log
    - Control.Monad.Freer.Extras.Modify
    - Control.Monad.Freer.Extras.Pagination
    - Control.Monad.Freer.Extras.State
    - Control.Monad.Freer.Extras.Stream
  dependencies:
    - aeson
    - base >=4.7 && <5
    - containers
    - data-default
    - lens
    - mtl
    - polysemy
    - polysemy-plugin
    - prettyprinter
    - streaming
    - text
    - time-units
tests:
  freer-extras-test:
    main: Spec.hs
    source-dirs: test
    other-modules:
      - Control.Monad.Freer.Extras.PaginationSpec
    dependencies:
      - base >=4.7 && <5
      - containers
      - freer-extras ^>=1.4.0
      - hedgehog
      - tasty
      - tasty-hedgehog
