name: Haskell CI

on:
  merge_group:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: '0 0 */6 * *'

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and run tests
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository code
        uses: actions/checkout@v7

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}

      - name: Access the Cabal cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/cabal/packages
            ~/.local/state/cabal/store
            dist-newstyle
          key: ${{ runner.os }}-${{ hashFiles('**/*.cabal', 'cabal.project', 'flake.nix', 'flake.lock') }}-build-and-test

      - name: Build and run tests
        env:
          TMPDIR: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
          KEEP_WORKSPACE: 1
        run: |
          nix develop .#ci --command bash -s <<'EOF'
            set -uo pipefail

            cabal update 2>&1 | tee cabal-update.out
            cabal_update_status=$?
            printf "%s\n" "$cabal_update_status" > cabal-update.res

            cabal build all --enable-tests 2>&1 | tee cabal-build.out
            cabal_build_status=$?
            printf "%s\n" "$cabal_build_status" > cabal-build.res

            cabal test all --enable-tests --test-show-details=direct -j1 2>&1 | tee cabal-test.out
            cabal_test_status=$?
            printf "%s\n" "$cabal_test_status" > cabal-test.res
          EOF

      - name: Upload build and test outputs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: haskell-ci-results
          path: |
            ./*.out
            ./*.res
          if-no-files-found: warn

  check-result:
    name: Check build and test results
    runs-on: ubuntu-latest
    needs: build-and-test
    if: always()
    permissions: {}

    steps:
      - name: Access build and test outputs
        uses: actions/download-artifact@v8
        with:
          name: haskell-ci-results

      - name: Check build and test results
        run: |
          set -euo pipefail
          result=0

          for step in cabal-update cabal-build cabal-test; do
            echo "Results for $step"

            if [[ ! -f "$step.out" || ! -f "$step.res" ]]; then
              echo "Missing output or result for $step"
              result=1
              continue
            fi

            cat "$step.out"
            status=$(cat "$step.res")
            echo "$step exit status: $status"

            if [[ "$status" != "0" ]]; then
              result=1
            fi
          done

          exit "$result"

  run-and-cache-flake-checks:
    name: Run flake checks
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository code
        uses: actions/checkout@v7

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}

      - name: Run flake checks
        run: nix flake check --print-build-logs
